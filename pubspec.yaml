name: update_checker_bottom_sheet
description: A simple and customizable Flutter package to check for app updates via GitHub Releases, with built-in OTA downloading and installation support for Android.
version: 0.0.5
repository: https://github.com/jydv402/update_checker_bottom_sheet
homepage: https://github.com/jydv402/update_checker_bottom_sheet
issue_tracker: https://github.com/jydv402/update_checker_bottom_sheet/issues

topics:
  - update
  - bottom-sheet
  - ota
  - android
  - github

screenshots:
  - description: "Update Available screen"
    path: assets/screenshots/update_available.png
  - description: "Downloading update"
    path: assets/screenshots/downloading.png
  - description: "Installing update"
    path: assets/screenshots/installing.png

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  ota_update: ^7.1.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.jdmakes.update_checker_bottom_sheet
        pluginClass: UpdateCheckerBottomSheetPlugin
